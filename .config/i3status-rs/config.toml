[theme]
theme = "plain"
[theme.overrides]        # based on https://github.com/mmdbalkhi/persian-landscapes
idle_bg = "#263335"      # bg-main
idle_fg = "#E0E8E4"      # fg-main
info_bg = "#2E3D3E"      # bg-alt
info_fg = "#E0E8E4"      # fg-main
good_bg = "#263335"      # bg-main
good_fg = "#91B18C"      # green/success
warning_bg = "#C5A96F"   # yellow/warning
warning_fg = "#263335"   # bg-main (for contrast)
critical_bg = "#D2837C"  # red/error
critical_fg = "#263335"  # bg-main (for contrast)
separator = "\ue0b2"
separator_bg = "auto"
separator_fg = "auto"

[icons]
icons = "awesome6"
[icons.overrides]
bat = " | | "
bat_full = " |X| "
bat_charging = " |^| "
bat_discharging = " |v| "

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = "$icon $zram_decompressed"
[[block]]
block = "load"
interval = 1

[[block]]
block = "cpu"

[[block]]
block = "temperature"
interval = 10
chip = "*-isa-*"
format = " $icon $max max "
format_alt = " $icon $min min, $max max, $average avg "

[[block]]
block = "net"
format = "  $speed_down  $speed_up "

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "weather"
format = " $icon $temp "
[block.service]
name = "openweathermap"
api_key = "3e321f9414eaedbfab34983bda77a66e" # awesome lains default api_key
city_id = "113646" # Tabriz, Iran city_id
units = "metric"

[[block]]
block = "time"
interval = 60
format = "$timestamp.datetime(f:'%R') "

